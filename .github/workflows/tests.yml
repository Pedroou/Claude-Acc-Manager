name: tests

# The suites are hermetic: each builds a throwaway $HOME, a stand-in `claude`
# and a fake /proc, so nothing here needs Claude Code or an account - fish, jq
# and rsync are the whole dependency list.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    # Both the last fish 3 and the current fish 4: the README's floor is
    # whatever this proves, not what the changelogs suggest.
    strategy:
      fail-fast: false
      matrix:
        fish: [release-3, release-4]
    name: fish ${{ matrix.fish }}
    steps:
      - uses: actions/checkout@v4

      - name: Install fish, jq and rsync
        run: |
          sudo apt-add-repository -y ppa:fish-shell/${{ matrix.fish }}
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fish jq rsync
          fish -c 'echo "fish $version"'

      - name: Tests
        run: fish --no-config test/run.fish
