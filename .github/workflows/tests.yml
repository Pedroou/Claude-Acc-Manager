name: tests

# The suites are hermetic: each builds a throwaway $HOME, a stand-in `claude`
# and a fake /proc, so nothing here needs Claude Code or an account - fish, jq
# and rsync are the whole dependency list.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The distribution's fish can lag behind; the fish PPA tracks releases.
      - name: Install fish, jq and rsync
        run: |
          sudo apt-add-repository -y ppa:fish-shell/release-4
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fish jq rsync

      # The functions use the `path` builtin, which arrived in fish 3.5. Fail
      # here with a reason rather than in a suite with "path: unknown command".
      - name: Check fish is new enough
        run: |
          fish -c 'echo "fish $version"'
          fish -c 'builtin --names | string match -q path' \
            || { echo "::error::this fish has no \`path\` builtin (needs 3.5+)"; exit 1; }

      - name: Tests
        run: fish --no-config test/run.fish
